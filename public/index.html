        <div class="home-app-grid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-content:start"><sc-for list="{{ homeApps }}" as="ap"><div class="home-tile" sc-camel-on-click="{{ ap.on }}" style="position:relative;height:62px;border-radius:16px;background:var(--theme-surface);border:1px solid var(--theme-border);display:flex;flex-direction:column;justify-content:space-between;padding:10px;cursor:pointer;box-sizing:border-box"><div class="nf home-tile-glyph" style="font-size:17px;line-height:1;color: {{ ap.c }}">{{ ap.g }}</div><div class="home-tile-name" style="font-size:10px;color:var(--theme-secondary)">{{ ap.n }}</div><span class="home-app-badge" style="display: {{ ap.badgeDisplay }}">{{ ap.badge }}</span></div></sc-for><button class="home-pin" sc-camel-on-click="{{ managePins }}" aria-label="Manage pinned apps"><span class="nf"></span><small>pin</small></button></div>
      </div>
      <div id="home-metrics"></div><div id="home-widgets"></div>
      <div class="workspace-label" style="position:absolute;top:0;left:0;right:0;padding:26px 28px;font-size:28px;color:var(--theme-foreground);background:linear-gradient(var(--theme-background) 60%,transparent);opacity:0;pointer-events:none">home</div>
    </div>

  </div>

  <div class="expo-swipe-hint" aria-hidden="true" style="opacity: {{ swipeHintOpacity }}"></div>
  <div class="shell-overlay" style="position:absolute;left:0;right:0;top:52px;z-index:14;background:color-mix(in srgb, var(--theme-terminal) 96%, transparent);border:1px solid var(--theme-border);border-top:0;border-radius:0 0 28px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5);visibility: {{ launchVisibility }};transform: {{ launchTf }};transition: {{ tr }};padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px">
    <div id="dashboard-launcher"></div>
  </div>


</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  APPS = window.HyprlandApps.catalog; // see public/apps.js
  T = {
    bg: 'var(--theme-background)',
    sf: 'var(--theme-surface)',
    sf2: 'var(--theme-surface-raised)',
    bd: 'var(--theme-border)',
    fg: 'var(--theme-foreground)',
    mu: 'var(--theme-secondary)',
    dim: 'var(--theme-dim)',
    love: 'var(--theme-red)',
    gold: 'var(--theme-yellow)',
    rose: 'var(--theme-rose)',
    foam: 'var(--theme-green)',
    iris: 'var(--theme-magenta)',
  };
  state = {
    ws: 0,
    open: ['home'],
    desk: !!window.HyprlandDesk?.isDesk(),
    deskW: window.innerWidth,
    deskH: window.innerHeight,
    tiles: {},
    windowLayout: 'dwindle',
    splits: {},
    splitAxes: {},
    focus: null,
    full: [],
    ov: false,
    kb: false,
    launch: false,
  };
  async componentDidMount() {
    await window.HyprlandPreferences?.ready;
    await window.HyprlandWebApps?.ready;
    window.HyprlandPreferences?.bind(this);
    window.HyprlandWebApps?.bind(this);
    this.hostChanged = () => this.set({});
    document.addEventListener('hyprland-host', this.hostChanged);
    window.addEventListener('online', this.hostChanged);
    window.addEventListener('offline', this.hostChanged);
    this.cards = window.HyprlandCards?.attach(this);
    this.remote = window.HyprlandRemote?.attach(this);
    window.HyprlandThemes.attach();
    this.expo = window.HyprlandExpo.attach(this);
    this.widgets = window.HyprlandWidgets.attach(this);
    this.dashboard = window.HyprlandDashboard.attach(this);
    this.desk = window.HyprlandDesk?.attach(this);
    window.updateDeviceBattery?.();
  }
  componentDidUpdate() {
    window.HyprlandPreferences?.update(this);
    this.cards?.update();
    this.remote?.update();
    this.expo?.update();
    this.widgets?.update();
    this.dashboard?.update();
    this.desk?.update();
    window.updateDeviceBattery?.();
  }
  componentWillUnmount() {
    document.removeEventListener('hyprland-host', this.hostChanged);
    window.removeEventListener('online', this.hostChanged);
    window.removeEventListener('offline', this.hostChanged);
    this.desk?.dispose();
    this.cards?.dispose();
    this.dashboard?.dispose();
    this.widgets?.dispose();
    this.expo?.dispose();
    this.remote?.dispose();
  }
  ptr = null;
  wx = null;
  cancel = () => {
    this.ptr = null;
  };
  set(p) {
    this.setState(p);
  }
  cur() {
    const s = this.state;
    return s.desk && window.HyprlandDesk ? window.HyprlandDesk.cur(s) : s.open[s.ws];
  }
  reset() {
    return { ov: false, kb: false, launch: false };
  }
  // Desk mode: workspaces hold several windows; `jump` and `focusApp` address a window by app key.
  jump(key) {
    const s = this.state;
    if (s.desk && window.HyprlandDesk) {
      const D = window.HyprlandDesk;
      if (key === s.scratchKey) return this.set({ scratchVisible: true, focus: key, ov: false });
      this.set({ ...D.go(s, D.deskOf(s, key)), focus: key, ...this.reset() });
    } else this.go(s.open.indexOf(key));
  }
  focusApp(key) {
    const s = this.state;
    if (!s.desk || !window.HyprlandDesk || !s.open.includes(key)) return this.openApp(key);
    if (key === s.scratchKey) this.set({ scratchVisible: true, focus: key });
    else this.set({ ws: window.HyprlandDesk.deskOf(s, key), focus: key, scratchVisible: false });
  }
  openLauncher() {
    const show = () => this.set({ launch: true, kb: true, ov: false });
    if (window.ReactDOM?.flushSync) window.ReactDOM.flushSync(show);
    else show();
    this.dashboard?.field.focus();
  }
  go(i, open) {
    open = open || this.state.open;
    const s = this.state;
    if (s.desk && window.HyprlandDesk) {
      this.set({ open, ...window.HyprlandDesk.go({ ...s, open }, i), ...this.reset() });
      return;
    }
    const n = open.length;
    this.set({ open, ws: Math.max(0, Math.min(n - 1, i)), ...this.reset() });
  }
  openApp(key) {
    if (!this.APPS[key]) return;
    const s = this.state;
    const i = s.open.indexOf(key);
    if (s.desk && window.HyprlandDesk) {
      if (i < 0 && s.open.length >= 10) {
        this.expo?.error('Maximum 10 windows. Close one in Expo to open another.');
        return;
      }
      this.set({ ...window.HyprlandDesk.open(s, key), ...this.reset() });
      return;
    }
    if (i >= 0) return this.go(i);
    if (s.open.length >= 10) {
      this.expo?.error('Maximum 10 workspaces. Close an app in Expo to open another.');
      return;
    }
    const open = [...s.open, key];
    this.go(open.length - 1, open);
  }
  async closeApp(k, expo = false) {
    if (k === 'home' || !this.state.open.includes(k) || this.closing) return;
    this.closing = true;
    try {
      await this.remote?.closeApp(k);
      window.HyprlandApps?.forgetInstance(k);
      const s = this.state;
      if (s.desk && window.HyprlandDesk) {
        this.set({
          ...window.HyprlandDesk.close(s, k),
          ov: expo,
          kb: false,
        });
      } else {
        const current = this.cur(),
          open = s.open.filter(x => x !== k),
          ws = current === k ? Math.max(0, s.ws - 1) : open.indexOf(current);
        this.set({ open, ws, ov: expo, kb: false });
      }
    } catch (e) {
      this.expo?.error('Could not close app. Check the host connection and try again.');
      this.set({});
    } finally {
      this.closing = false;
    }
  }
  closeWs() {
    this.closeApp(this.cur());
  }
  down = e => {
    const r = e.currentTarget.getBoundingClientRect();
    this.ptr = {
      x: e.clientX - r.left,
      y: e.clientY - r.top,
      cx: e.clientX,
      cy: e.clientY,
      w: r.width,
      h: r.height,
    };
  };
  up = e => {
    const p = this.ptr;
    if (!p) return;
    this.ptr = null;
    const dx = e.clientX - p.cx,
      dy = e.clientY - p.cy,
      s = this.state,
      E = Math.max(24, p.w * 0.08),
      T = 40,
      third = p.w / 3;
    if (s.launch && dy < -T) return this.set({ launch: false, kb: false });
    if (p.y > p.h - E && dy < -T) {
      const corner = p.w * 0.15;
      if (p.x < corner || p.x > p.w - corner) {
        if (this.APPS[this.cur()]?.native) return this.set({ kb: true, ov: false, launch: false });
        return;
      }
      return this.set({ ov: !s.ov, kb: false, launch: false });
    }
    // Only the middle of the in-app bar opens the launcher. Corners belong to the OS.
    if (p.y < 70 && dy > T) {
      if (p.x >= third && p.x <= 2 * third) return this.openLauncher();
      return;
    }
    if (s.ov && dy > T && Math.abs(dx) < T) return this.set({ ov: false });
    if (p.x < E && dx > T) return this.go(s.ws - 1);
    if (p.x > p.w - E && dx < -T) return this.go(s.ws + 1);
  };
  // Card geometry for every catalog app (public/cards.js paints it); the desk replaces it above 600 px.
  layout() {
    const s = this.state,
      A = this.APPS;
    const dur = '.5s',
      ease = 'cubic-bezier(.22,.9,.24,1)',
      // Width and height animate too, so a surviving desk tile grows into freed space instead of snapping.
      tr = `transform ${dur} ${ease}, width ${dur} ${ease}, height ${dur} ${ease}, opacity ${dur} ${ease}, border-color .3s, border-radius ${dur} ${ease}`;
    const n = s.open.length,
      cols = n <= 4 ? 2 : 3,
      sc = n <= 4 ? 0.35 : n > 9 ? 0.19 : 0.26,
      x0 = n <= 4 ? 45 : 29,
      dx = n <= 4 ? 171 : 120,
      y0 = n <= 4 ? 104 : n > 9 ? 80 : 96,
      dy = n <= 4 ? 328 : n > 9 ? 190 : 243;
    const cards = {};
    Object.keys(A).forEach(k => {
      const i = s.open.indexOf(k),
        on = i >= 0;
      cards[k] = {
        tf: !on
          ? 'translate(440px,0px) scale(1)'
          : s.ov
            ? `translate(${x0 + (i % cols) * dx}px,${y0 + Math.floor(i / cols) * dy}px) scale(${sc})`
            : `translate(${(i - s.ws) * 440}px,0px) scale(1)`,
        bd: i === s.ws ? 'var(--theme-accent)' : 'var(--theme-window-inactive)',
        lab: s.ov ? 1 : 0,
        op: on ? 1 : 0,
        pe: on ? 'auto' : 'none',
        w: '100%',
        h: '100%',
      };
    });
    const D =
      s.desk && window.HyprlandDesk ? window.HyprlandDesk.render(this, s, s.deskW, s.deskH) : null;
    if (D) Object.assign(cards, D.cards);
    return { cards, tr, rad: s.ov ? '28px' : '0px', D };
  }
  renderVals() {
    const s = this.state,
      T = this.T,
      A = this.APPS;
    const { tr, rad, D } = this.layout();
    const pills = D
      ? D.pills
      : s.open.map((k, i) => ({
          i: i + 1,
          col: T.mu,
          bg: i === s.ws ? T.sf2 : 'transparent',
          c: i === s.ws ? T.fg : T.mu,
          on: () => {
            if (i === this.state.ws) this.set({ ov: !this.state.ov, kb: false });
            else this.go(i);
          },
        }));
    const online = typeof navigator === 'undefined' || navigator.onLine !== false;
    const homeKeys = s.homePins || window.HyprlandApps.DEFAULT_PINS;
    return {
      swipeHintOpacity: s.ov || s.kb || s.launch ? 0 : 1,
      down: this.down,
      up: this.up,
      cancel: this.cancel,
      tr,
      rad,
      pills,
      wsLabel: D ? D.label : '',
      isWifi: online,
      isOff: !online,
      managePins: () => this.dashboard?.managePins(),
      homeApps: homeKeys
        .filter(k => A[k])
        .map(k => ({
          g: A[k].icon || A[k].glyph,
          n: A[k].name,
          c: A[k].color,
          op: 1,
          badge: s.badges?.[k] || '',
          badgeDisplay: s.badges?.[k] ? 'block' : 'none',
          on: () => this.openApp(k),
        })),
      launchVisibility: s.launch ? 'visible' : 'hidden',
      launchTf: s.launch ? 'translateY(0)' : 'translateY(-104%)',
    };
  }
}
</script>
