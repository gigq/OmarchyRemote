plugins {
    id 'com.android.application'
}
def releaseSigning = [
    storeFile: providers.environmentVariable('OMARCHY_ANDROID_KEYSTORE').orNull,
    storePassword: providers.environmentVariable('OMARCHY_ANDROID_STORE_PASSWORD').orNull,
    keyAlias: providers.environmentVariable('OMARCHY_ANDROID_KEY_ALIAS').orNull,
    keyPassword: providers.environmentVariable('OMARCHY_ANDROID_KEY_PASSWORD').orNull,
]
if (releaseSigning.values().any { it } && !releaseSigning.values().every { it }) {
    throw new GradleException('Set all four OMARCHY_ANDROID signing environment variables; see docs/android-signing.md')
}
android {
    namespace 'dev.omarchy.remote'
    compileSdk 36
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId providers.gradleProperty('applicationId').getOrElse('dev.omarchy.remote')
        minSdk 30
        targetSdk 35
        versionCode providers.gradleProperty('versionCode').getOrElse('2').toInteger()
        versionName providers.gradleProperty('versionName').getOrElse('0.3.0')
        buildConfigField 'String', 'REMOTE_URL', groovy.json.JsonOutput.toJson(providers.gradleProperty('remoteUrl').getOrElse(''))
    }
    signingConfigs {
        release {
            if (releaseSigning.storeFile) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.register('prepareShell', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/prepare-native.py', '--output', 'android/app/src/main/assets/Web'
    inputs.dir file('../../public')
    inputs.file file('../../ios/WebOverrides/native.css')
    outputs.dir file('src/main/assets/Web')
}
tasks.named('preBuild').configure {
    dependsOn 'prepareShell'
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
