[package]
name = "omarchy-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vt100 = "0.15"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
