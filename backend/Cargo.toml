[package]
name = "omarchy-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vt100 = "0.15"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

regex = "1"
walkdir = "2"
globset = "0.4"
sha2 = "0.10"
libc = "0.2"
zip = { version = "2", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
