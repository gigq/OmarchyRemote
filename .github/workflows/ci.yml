# Host-independent checks. The Playwright suite, `npm run test:live`, and
# `npm run test:backend` need a running Omarchy host and stay local.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The worker tests import the standalone build, so build first.
      - run: npm run build
      - run: npm test # Prettier check plus the Node unit tests
  backend:
    runs-on: ubuntu-latest
    steps:
      # The backend uses Corral's server from its own repository, beside this one.
      - uses: actions/checkout@v4
        with:
          path: OmarchyRemote
      - uses: actions/checkout@v4
        with:
          repository: gigq/Corral
          path: Corral
          ssh-key: ${{ secrets.CORRAL_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OmarchyRemote/backend
      - run: cargo fmt --manifest-path OmarchyRemote/backend/Cargo.toml --all --check
      - run: cargo clippy --manifest-path OmarchyRemote/backend/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path OmarchyRemote/backend/Cargo.toml --workspace
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swift-format lint --strict --configuration .swift-format -r ios/OmarchyRemote ios/OmarchyRemoteUITests
      - run: >
          xcodebuild build-for-testing -project ios/OmarchyRemote.xcodeproj -scheme OmarchyRemote
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
